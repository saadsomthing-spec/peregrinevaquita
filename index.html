<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Universal Pop Wall</title>

    <!-- Supabase browser library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase URL + public key -->
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef2f3;
            overflow: hidden;
        }

        /* -----------------------------------
           SHARED WALL
        ----------------------------------- */

        #canvas-wall {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* -----------------------------------
           CONNECTION STATUS
        ----------------------------------- */

        #connection-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            background: white;
            padding: 7px 13px;

            border-radius: 20px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.12);

            font-size: 12px;
            font-weight: 600;

            z-index: 5000;
        }

        /* -----------------------------------
           POPPED MESSAGES
        ----------------------------------- */

        .popped-msg {
            position: absolute;

            min-width: 50px;
            max-width: 350px;

            padding: 10px 14px;

            background: white;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.14);

            font-size: 17px;

            word-break: break-word;

            cursor: grab;

            user-select: none;
            touch-action: none;

            z-index: 10;

            transform: scale(0);

            animation:
                popIn 0.28s
                cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                )
                forwards;
        }

        .popped-msg.dragging {
            cursor: grabbing;

            z-index: 1000;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.23);
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        /* -----------------------------------
           CONTROLS
        ----------------------------------- */

        #control-panel {
            position: fixed;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;

            gap: 8px;

            padding: 12px 16px;

            border-radius: 30px;

            background: white;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.18);

            z-index: 5000;
        }

        #msg-input {
            width: 270px;

            border: 1px solid #d5d5d5;

            border-radius: 20px;

            outline: none;

            padding: 10px 14px;

            font-size: 15px;
        }

        #msg-input:focus {
            border-color: #777;
        }

        .format-btn {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 1px solid #ddd;

            background: #f6f6f6;

            cursor: pointer;

            font-size: 16px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .format-btn.active {
            background: #222;
            color: white;
            border-color: #222;
        }

        #send-btn {
            height: 40px;

            padding: 0 18px;

            border: none;
            border-radius: 20px;

            background: #ff4757;
            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        #send-btn:hover {
            background: #ff6471;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #sound-btn {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 1px solid #ddd;

            background: #f6f6f6;

            cursor: pointer;
        }

        /* -----------------------------------
           MOBILE
        ----------------------------------- */

        @media (max-width: 700px) {
            #control-panel {
                width: calc(100% - 20px);

                bottom: 10px;

                padding: 10px;

                border-radius: 18px;

                flex-wrap: wrap;

                justify-content: center;
            }

            #msg-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="canvas-wall"></div>

    <div id="connection-status">
        Connecting...
    </div>

    <div id="control-panel">

        <input
            type="text"
            id="msg-input"
            maxlength="500"
            placeholder="Type something..."
            autocomplete="off"
        >

        <button
            class="format-btn"
            id="bold-btn"
            type="button"
            onclick="toggleStyle('bold')"
        >
            <b>B</b>
        </button>

        <button
            class="format-btn"
            id="italic-btn"
            type="button"
            onclick="toggleStyle('italic')"
        >
            <i>I</i>
        </button>

        <button
            class="format-btn"
            id="underline-btn"
            type="button"
            onclick="toggleStyle('underline')"
        >
            <u>U</u>
        </button>

        <button
            id="sound-btn"
            type="button"
            onclick="unlockAudio()"
            title="Enable pop sounds"
        >
            🔊
        </button>

        <button
            id="send-btn"
            type="button"
            onclick="sendMessage()"
        >
            POP IT!
        </button>

    </div>


    <script>

        /* =========================================================
           BASIC ELEMENTS
        ========================================================= */

        const wall =
            document.getElementById("canvas-wall");

        const input =
            document.getElementById("msg-input");

        const sendButton =
            document.getElementById("send-btn");

        const connectionStatus =
            document.getElementById("connection-status");


        /* =========================================================
           FORMAT STATE
        ========================================================= */

        let currentStyles = {
            bold: false,
            italic: false,
            underline: false
        };


        /* =========================================================
           AUDIO
        ========================================================= */

        let audioContext = null;


        function unlockAudio() {

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }

            if (audioContext.state === "suspended") {

                audioContext.resume();

            }

            document.getElementById("sound-btn").innerText =
                "🔊";

        }


        function playPopSound() {

            if (!audioContext) {
                return;
            }

            try {

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();


                oscillator.type = "sine";


                oscillator.frequency.setValueAtTime(
                    180,
                    audioContext.currentTime
                );


                oscillator.frequency.exponentialRampToValueAtTime(
                    650,
                    audioContext.currentTime + 0.12
                );


                gain.gain.setValueAtTime(
                    0.20,
                    audioContext.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    audioContext.currentTime + 0.12
                );


                oscillator.connect(gain);

                gain.connect(audioContext.destination);


                oscillator.start();

                oscillator.stop(
                    audioContext.currentTime + 0.12
                );

            }

            catch (error) {

                console.warn(
                    "Could not play pop sound:",
                    error
                );

            }

        }


        /*
            Browsers normally require at least one user interaction
            before audio can start.

            Clicking anywhere once unlocks audio.
        */

        document.addEventListener(
            "pointerdown",
            unlockAudio,
            {
                once: true
            }
        );


        /* =========================================================
           SUPABASE CONFIG CHECK
        ========================================================= */

        let supabaseClient = null;


        function initializeSupabase() {

            if (
                typeof supabase === "undefined"
            ) {

                connectionStatus.innerText =
                    "Supabase library failed";

                console.error(
                    "Supabase JS did not load."
                );

                return false;
            }


            if (
                !window.SUPABASE_CONFIG ||
                !window.SUPABASE_CONFIG.URL ||
                !window.SUPABASE_CONFIG.ANON_KEY
            ) {

                connectionStatus.innerText =
                    "Missing config.js";

                console.error(
                    "SUPABASE_CONFIG is missing."
                );

                return false;
            }


            supabaseClient =
                supabase.createClient(

                    window.SUPABASE_CONFIG.URL,

                    window.SUPABASE_CONFIG.ANON_KEY

                );


            return true;

        }


        /* =========================================================
           TEXT FORMATTING
        ========================================================= */

        function toggleStyle(style) {

            currentStyles[style] =
                !currentStyles[style];


            const button =
                document.getElementById(
                    style + "-btn"
                );


            if (button) {

                button.classList.toggle(
                    "active",
                    currentStyles[style]
                );

            }

        }


        /* =========================================================
           POSITION
        ========================================================= */

        function clamp(
            value,
            minimum,
            maximum
        ) {

            return Math.min(
                Math.max(value, minimum),
                maximum
            );

        }


        function updateElementPosition(
            id,
            xPercent,
            yPercent
        ) {

            const element =
                document.getElementById(id);


            if (!element) {
                return;
            }


            element.dataset.xPercent =
                xPercent;

            element.dataset.yPercent =
                yPercent;


            const maxX =
                Math.max(
                    0,
                    window.innerWidth -
                    element.offsetWidth
                );


            const maxY =
                Math.max(
                    0,
                    window.innerHeight -
                    element.offsetHeight
                );


            const x =
                clamp(
                    xPercent * window.innerWidth,
                    0,
                    maxX
                );


            const y =
                clamp(
                    yPercent * window.innerHeight,
                    0,
                    maxY
                );


            element.style.left =
                x + "px";

            element.style.top =
                y + "px";

        }


        /* =========================================================
           RENDER MESSAGE
        ========================================================= */

        function renderMessage(
            message,
            silent = false
        ) {

            const existing =
                document.getElementById(
                    message.id
                );


            /*
                Prevent duplicates.

                Important because sender renders locally,
                then Supabase also sends the INSERT event.
            */

            if (existing) {

                updateElementPosition(
                    message.id,
                    message.xPercent,
                    message.yPercent
                );

                return;

            }


            const element =
                document.createElement("div");


            element.className =
                "popped-msg";


            element.id =
                message.id;


            element.innerText =
                message.text;


            if (message.bold) {

                element.style.fontWeight =
                    "bold";

            }


            if (message.italic) {

                element.style.fontStyle =
                    "italic";

            }


            if (message.underline) {

                element.style.textDecoration =
                    "underline";

            }


            wall.appendChild(element);


            updateElementPosition(
                message.id,
                message.xPercent,
                message.yPercent
            );


            setupElementDraggability(
                element
            );


            if (!silent) {

                playPopSound();

            }

        }


        /* =========================================================
           DATABASE POSITION UPDATE
        ========================================================= */

        async function syncPosition(
            id,
            xPercent,
            yPercent
        ) {

            if (!supabaseClient) {
                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("pops")
                    .update({

                        x_percent:
                            xPercent,

                        y_percent:
                            yPercent

                    })
                    .eq(
                        "id",
                        id
                    );


            if (error) {

                console.error(
                    "Position update failed:",
                    error
                );

            }

        }


        /* =========================================================
           DRAGGING

           Pointer Events work for BOTH:
           - mouse
           - touch
           - stylus
        ========================================================= */

        function setupElementDraggability(
            element
        ) {

            let dragging =
                false;


            let offsetX =
                0;


            let offsetY =
                0;


            let lastSyncTime =
                0;


            element.addEventListener(
                "pointerdown",
                function (event) {

                    dragging =
                        true;


                    element.classList.add(
                        "dragging"
                    );


                    element.setPointerCapture(
                        event.pointerId
                    );


                    const rect =
                        element.getBoundingClientRect();


                    offsetX =
                        event.clientX -
                        rect.left;


                    offsetY =
                        event.clientY -
                        rect.top;


                    event.preventDefault();

                }
            );


            element.addEventListener(
                "pointermove",
                function (event) {

                    if (!dragging) {
                        return;
                    }


                    const maxX =
                        Math.max(
                            0,
                            window.innerWidth -
                            element.offsetWidth
                        );


                    const maxY =
                        Math.max(
                            0,
                            window.innerHeight -
                            element.offsetHeight
                        );


                    const newX =
                        clamp(
                            event.clientX -
                            offsetX,
                            0,
                            maxX
                        );


                    const newY =
                        clamp(
                            event.clientY -
                            offsetY,
                            0,
                            maxY
                        );


                    const xPercent =
                        newX /
                        window.innerWidth;


                    const yPercent =
                        newY /
                        window.innerHeight;


                    element.style.left =
                        newX + "px";


                    element.style.top =
                        newY + "px";


                    element.dataset.xPercent =
                        xPercent;


                    element.dataset.yPercent =
                        yPercent;


                    /*
                        Send movement approximately
                        10 times per second.

                        This makes dragging appear live
                        on other people's screens
                        without sending hundreds of
                        database updates every second.
                    */

                    const now =
                        Date.now();


                    if (
                        now -
                        lastSyncTime >=
                        100
                    ) {

                        lastSyncTime =
                            now;


                        syncPosition(
                            element.id,
                            xPercent,
                            yPercent
                        );

                    }

                }
            );


            async function finishDrag(
                event
            ) {

                if (!dragging) {
                    return;
                }


                dragging =
                    false;


                element.classList.remove(
                    "dragging"
                );


                try {

                    if (
                        element.hasPointerCapture(
                            event.pointerId
                        )
                    ) {

                        element.releasePointerCapture(
                            event.pointerId
                        );

                    }

                }

                catch (error) {
                    // Safe to ignore.
                }


                const xPercent =
                    Number(
                        element.dataset.xPercent
                    );


                const yPercent =
                    Number(
                        element.dataset.yPercent
                    );


                await syncPosition(
                    element.id,
                    xPercent,
                    yPercent
                );

            }


            element.addEventListener(
                "pointerup",
                finishDrag
            );


            element.addEventListener(
                "pointercancel",
                finishDrag
            );

        }


        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        async function sendMessage() {

            const text =
                input.value.trim();


            if (!text) {
                return;
            }


            unlockAudio();


            const id =
                "pop_" +
                crypto.randomUUID();


            const payload = {

                id: id,

                text: text,

                xPercent:
                    Math.random() *
                    0.65 +
                    0.05,

                yPercent:
                    Math.random() *
                    0.60 +
                    0.05,

                bold:
                    currentStyles.bold,

                italic:
                    currentStyles.italic,

                underline:
                    currentStyles.underline

            };


            /*
                Show it instantly on sender's screen.
            */

            renderMessage(
                payload
            );


            input.value =
                "";


            if (!supabaseClient) {

                console.error(
                    "Supabase is not initialized."
                );

                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("pops")
                    .insert({

                        id:
                            payload.id,

                        text:
                            payload.text,

                        x_percent:
                            payload.xPercent,

                        y_percent:
                            payload.yPercent,

                        bold:
                            payload.bold,

                        italic:
                            payload.italic,

                        underline:
                            payload.underline

                    });


            if (error) {

                console.error(
                    "Insert failed:",
                    error
                );


                alert(
                    "Message appeared locally, " +
                    "but Supabase could not save it. " +
                    "Open F12 → Console."
                );

            }

        }


        /* =========================================================
           LOAD EXISTING POPS
        ========================================================= */

        async function loadExistingPops() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("pops")
                    .select("*")
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    )
                    .limit(200);


            if (error) {

                console.error(
                    "Could not load pops:",
                    error
                );

                return;

            }


            for (
                const pop of data
            ) {

                renderMessage(
                    {

                        id:
                            pop.id,

                        text:
                            pop.text,

                        xPercent:
                            pop.x_percent,

                        yPercent:
                            pop.y_percent,

                        bold:
                            pop.bold,

                        italic:
                            pop.italic,

                        underline:
                            pop.underline

                    },

                    true

                );

            }

        }


        /* =========================================================
           REALTIME
        ========================================================= */

        function startRealtime() {

            supabaseClient
                .channel(
                    "universal-pop-wall"
                )


                /* -------------------------
                   NEW POP
                ------------------------- */

                .on(

                    "postgres_changes",

                    {

                        event:
                            "INSERT",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    function (payload) {

                        const pop =
                            payload.new;


                        renderMessage({

                            id:
                                pop.id,

                            text:
                                pop.text,

                            xPercent:
                                pop.x_percent,

                            yPercent:
                                pop.y_percent,

                            bold:
                                pop.bold,

                            italic:
                                pop.italic,

                            underline:
                                pop.underline

                        });

                    }

                )


                /* -------------------------
                   MOVED POP
                ------------------------- */

                .on(

                    "postgres_changes",

                    {

                        event:
                            "UPDATE",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    function (payload) {

                        const pop =
                            payload.new;


                        updateElementPosition(

                            pop.id,

                            pop.x_percent,

                            pop.y_percent

                        );

                    }

                )


                /* -------------------------
                   CONNECTION
                ------------------------- */

                .subscribe(

                    function (status) {

                        console.log(
                            "Realtime status:",
                            status
                        );


                        if (
                            status ===
                            "SUBSCRIBED"
                        ) {

                            connectionStatus.innerText =
                                "● LIVE";

                        }

                        else if (
                            status ===
                            "CHANNEL_ERROR"
                        ) {

                            connectionStatus.innerText =
                                "Realtime error";

                        }

                        else if (
                            status ===
                            "TIMED_OUT"
                        ) {

                            connectionStatus.innerText =
                                "Connection timed out";

                        }

                        else if (
                            status ===
                            "CLOSED"
                        ) {

                            connectionStatus.innerText =
                                "Disconnected";

                        }

                    }

                );

        }


        /* =========================================================
           ENTER KEY
        ========================================================= */

        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    sendMessage();

                }

            }
        );


        /* =========================================================
           WINDOW RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            function () {

                const messages =
                    document.querySelectorAll(
                        ".popped-msg"
                    );


                messages.forEach(
                    function (element) {

                        const xPercent =
                            Number(
                                element.dataset.xPercent
                            );


                        const yPercent =
                            Number(
                                element.dataset.yPercent
                            );


                        updateElementPosition(

                            element.id,

                            xPercent,

                            yPercent

                        );

                    }
                );

            }
        );


        /* =========================================================
           APP START
        ========================================================= */

        async function startApp() {

            const success =
                initializeSupabase();


            if (!success) {

                sendButton.disabled =
                    true;

                return;

            }


            connectionStatus.innerText =
                "Loading wall...";


            await loadExistingPops();


            startRealtime();

        }


        startApp();

    </script>

</body>

</html>
