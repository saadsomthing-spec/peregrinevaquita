<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Family Pop Wall</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                #eef2f3;

            overflow:
                hidden;

            transition:
                background 0.3s ease;
        }

        body.dark {
            background:
                #111827;
        }


        /* =====================================================
           WALL
        ===================================================== */

        #canvas-wall {
            position:
                fixed;

            inset:
                0;

            overflow:
                hidden;
        }


        /* =====================================================
           CONNECTION STATUS
        ===================================================== */

        #connection-status {
            position:
                fixed;

            top:
                15px;

            left:
                50%;

            transform:
                translateX(-50%);

            background:
                white;

            padding:
                7px 13px;

            border-radius:
                20px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.12);

            font-size:
                12px;

            font-weight:
                600;

            z-index:
                5000;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .popped-msg {
            position:
                absolute;

            min-width:
                50px;

            max-width:
                350px;

            padding:
                10px 14px;

            background:
                white;

            border-radius:
                10px;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.14);

            font-size:
                17px;

            word-break:
                break-word;

            cursor:
                grab;

            user-select:
                none;

            touch-action:
                none;

            z-index:
                10;

            transform:
                scale(0);

            animation:
                popIn
                0.28s
                cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                )
                forwards;
        }

        .popped-msg.dragging {
            cursor:
                grabbing;

            z-index:
                1000;
        }

        @keyframes popIn {

            to {
                transform:
                    scale(1);
            }

        }

        @keyframes adminShake {

            0% {
                transform:
                    translateX(0);
            }

            20% {
                transform:
                    translateX(-12px);
            }

            40% {
                transform:
                    translateX(12px);
            }

            60% {
                transform:
                    translateX(-8px);
            }

            80% {
                transform:
                    translateX(8px);
            }

            100% {
                transform:
                    translateX(0);
            }

        }

        .shake {
            animation:
                adminShake
                0.5s;
        }


        /* =====================================================
           NORMAL CONTROL PANEL
        ===================================================== */

        #control-panel {
            position:
                fixed;

            left:
                50%;

            bottom:
                20px;

            transform:
                translateX(-50%);

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                12px 16px;

            border-radius:
                30px;

            background:
                white;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.18);

            z-index:
                5000;
        }

        #msg-input {
            width:
                270px;

            border:
                1px solid #d5d5d5;

            border-radius:
                20px;

            outline:
                none;

            padding:
                10px 14px;

            font-size:
                15px;
        }

        .format-btn {
            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            border:
                1px solid #ddd;

            background:
                #f6f6f6;

            cursor:
                pointer;

            font-size:
                16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }

        .format-btn.active {
            background:
                #222;

            color:
                white;

            border-color:
                #222;
        }

        #send-btn {
            height:
                40px;

            padding:
                0 18px;

            border:
                none;

            border-radius:
                20px;

            background:
                #ff4757;

            color:
                white;

            font-weight:
                bold;

            cursor:
                pointer;
        }

        #send-btn:disabled {
            opacity:
                0.5;

            cursor:
                not-allowed;
        }


        /* =====================================================
           ADMIN PANEL
        ===================================================== */

        #admin-panel {
            position:
                fixed;

            top:
                70px;

            right:
                20px;

            width:
                350px;

            padding:
                20px;

            background:
                rgba(15, 23, 42, 0.98);

            color:
                white;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius:
                18px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.4);

            z-index:
                10000;

            display:
                none;
        }

        #admin-panel.open {
            display:
                block;
        }

        #admin-title-row {
            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                15px;
        }

        #admin-title {
            font-size:
                20px;

            font-weight:
                800;
        }

        #admin-close {
            border:
                none;

            background:
                transparent;

            color:
                white;

            font-size:
                20px;

            cursor:
                pointer;
        }

        .admin-label {
            display:
                block;

            margin-top:
                12px;

            margin-bottom:
                6px;

            font-size:
                12px;

            font-weight:
                bold;

            color:
                #94a3b8;

            text-transform:
                uppercase;

            letter-spacing:
                1px;
        }

        .admin-input {
            width:
                100%;

            padding:
                11px 12px;

            border:
                1px solid #334155;

            border-radius:
                10px;

            outline:
                none;

            background:
                #0f172a;

            color:
                white;

            font-size:
                14px;
        }

        .admin-input:focus {
            border-color:
                #38bdf8;
        }

        #admin-run {
            width:
                100%;

            margin-top:
                16px;

            padding:
                12px;

            border:
                none;

            border-radius:
                10px;

            background:
                #38bdf8;

            color:
                #082f49;

            font-weight:
                900;

            cursor:
                pointer;
        }

        #admin-output {
            margin-top:
                14px;

            padding:
                10px;

            min-height:
                38px;

            background:
                #020617;

            border-radius:
                10px;

            font-family:
                monospace;

            font-size:
                12px;

            color:
                #86efac;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            #control-panel {
                width:
                    calc(100% - 20px);

                bottom:
                    10px;

                padding:
                    10px;

                flex-wrap:
                    wrap;

                justify-content:
                    center;

                border-radius:
                    18px;
            }

            #msg-input {
                width:
                    100%;
            }

            #admin-panel {
                width:
                    calc(100% - 20px);

                right:
                    10px;

                top:
                    60px;
            }

        }

    </style>

</head>

<body>


    <div id="canvas-wall"></div>


    <div id="connection-status">
        Connecting...
    </div>


    <!-- =====================================================
         NORMAL USER UI
    ====================================================== -->

    <div id="control-panel">

        <input
            type="text"
            id="msg-input"
            maxlength="500"
            placeholder="Type something..."
            autocomplete="off"
        >

        <button
            class="format-btn"
            id="bold-btn"
            onclick="toggleStyle('bold')"
        >
            <b>B</b>
        </button>

        <button
            class="format-btn"
            id="italic-btn"
            onclick="toggleStyle('italic')"
        >
            <i>I</i>
        </button>

        <button
            class="format-btn"
            id="underline-btn"
            onclick="toggleStyle('underline')"
        >
            <u>U</u>
        </button>

        <button
            id="send-btn"
            onclick="sendMessage()"
        >
            POP IT!
        </button>

    </div>


    <!-- =====================================================
         SECRET ADMIN UI
    ====================================================== -->

    <div id="admin-panel">

        <div id="admin-title-row">

            <div id="admin-title">
                ⚡ ADMIN CONSOLE
            </div>

            <button
                id="admin-close"
                onclick="closeAdmin()"
            >
                ✕
            </button>

        </div>


        <label class="admin-label">
            Command
        </label>

        <input
            id="admin-command-input"
            class="admin-input"
            list="admin-command-list"
            placeholder="Type or select command..."
            autocomplete="off"
        >


        <datalist id="admin-command-list">

            <option value="clear-wall"></option>

            <option value="lock-wall"></option>

            <option value="unlock-wall"></option>

            <option value="freeze-dragging"></option>

            <option value="enable-dragging"></option>

            <option value="dark-mode"></option>

            <option value="light-mode"></option>

            <option value="announce"></option>

            <option value="shake-wall"></option>

            <option value="randomize"></option>

        </datalist>


        <label class="admin-label">
            Value
        </label>

        <input
            id="admin-value-input"
            class="admin-input"
            placeholder="Optional value..."
            autocomplete="off"
        >


        <button
            id="admin-run"
            onclick="runAdminCommand()"
        >
            RUN COMMAND
        </button>


        <div id="admin-output">
            Ready.
        </div>

    </div>


    <script>


        /* =====================================================
           REFERENCES
        ===================================================== */

        const wall =
            document.getElementById(
                "canvas-wall"
            );

        const input =
            document.getElementById(
                "msg-input"
            );

        const sendButton =
            document.getElementById(
                "send-btn"
            );

        const connectionStatus =
            document.getElementById(
                "connection-status"
            );

        const adminPanel =
            document.getElementById(
                "admin-panel"
            );

        const adminCommandInput =
            document.getElementById(
                "admin-command-input"
            );

        const adminValueInput =
            document.getElementById(
                "admin-value-input"
            );

        const adminOutput =
            document.getElementById(
                "admin-output"
            );


        /* =====================================================
           SECRET
        ===================================================== */

        const ADMIN_SECRET =
            "peregrinefalcsonissohandsome";


        /* =====================================================
           SETTINGS
        ===================================================== */

        const MAX_MESSAGES =
            Math.max(
                1,
                Number(
                    window
                        .SUPABASE_CONFIG
                        ?.MAX_MESSAGES
                ) || 50
            );


        /* =====================================================
           STATE
        ===================================================== */

        let supabaseClient =
            null;

        let wallLocked =
            false;

        let draggingEnabled =
            true;

        let currentStyles = {

            bold:
                false,

            italic:
                false,

            underline:
                false

        };


        /* =====================================================
           SECRET INPUT DETECTOR
        ===================================================== */

        input.addEventListener(

            "input",

            function() {

                const typed =
                    input.value
                        .trim()
                        .toLowerCase();


                if (
                    typed ===
                    ADMIN_SECRET
                ) {

                    /*
                        IMPORTANT:

                        Delete the secret from the normal
                        message field BEFORE anything
                        can send it.
                    */

                    input.value =
                        "";


                    openAdmin();

                }

            }

        );


        /*
            Extra Enter protection.

            Even if the browser has not fired
            the input event for some unusual reason,
            Enter can NEVER submit the secret.
        */

        input.addEventListener(

            "keydown",

            function(event) {

                if (
                    event.key !==
                    "Enter"
                ) {

                    return;

                }


                const typed =
                    input.value
                        .trim()
                        .toLowerCase();


                if (
                    typed ===
                    ADMIN_SECRET
                ) {

                    event.preventDefault();

                    event.stopPropagation();

                    input.value =
                        "";

                    openAdmin();

                    return;

                }


                event.preventDefault();

                sendMessage();

            }

        );


        /* =====================================================
           ADMIN OPEN / CLOSE
        ===================================================== */

        function openAdmin() {

            adminPanel
                .classList
                .add(
                    "open"
                );

            adminCommandInput.value =
                "";

            adminValueInput.value =
                "";

            setAdminOutput(
                "Admin access granted."
            );

            setTimeout(
                function() {

                    adminCommandInput
                        .focus();

                },
                50
            );

        }


        function closeAdmin() {

            adminPanel
                .classList
                .remove(
                    "open"
                );

            adminCommandInput.value =
                "";

            adminValueInput.value =
                "";

            input.focus();

        }


        function setAdminOutput(
            message
        ) {

            adminOutput.innerText =
                message;

        }


        /* =====================================================
           SUPABASE
        ===================================================== */

        function initializeSupabase() {

            if (
                typeof supabase ===
                "undefined"
            ) {

                connectionStatus.innerText =
                    "Supabase failed";

                return false;

            }


            if (
                !window.SUPABASE_CONFIG ||
                !window.SUPABASE_CONFIG.URL ||
                !window.SUPABASE_CONFIG.ANON_KEY
            ) {

                connectionStatus.innerText =
                    "Missing config.js";

                return false;

            }


            supabaseClient =
                supabase.createClient(

                    window
                        .SUPABASE_CONFIG
                        .URL,

                    window
                        .SUPABASE_CONFIG
                        .ANON_KEY

                );


            return true;

        }


        /* =====================================================
           STYLE
        ===================================================== */

        function toggleStyle(
            style
        ) {

            currentStyles[style] =
                !currentStyles[style];


            document
                .getElementById(
                    style + "-btn"
                )
                .classList
                .toggle(

                    "active",

                    currentStyles[
                        style
                    ]

                );

        }


        /* =====================================================
           POSITION
        ===================================================== */

        function clamp(
            value,
            min,
            max
        ) {

            return Math.min(
                Math.max(
                    value,
                    min
                ),
                max
            );

        }


        function updateElementPosition(

            id,

            xPercent,

            yPercent

        ) {

            const element =
                document
                    .getElementById(
                        id
                    );


            if (!element) {

                return;

            }


            element.dataset.xPercent =
                xPercent;

            element.dataset.yPercent =
                yPercent;


            const maxX =
                Math.max(
                    0,
                    window.innerWidth -
                    element.offsetWidth
                );

            const maxY =
                Math.max(
                    0,
                    window.innerHeight -
                    element.offsetHeight
                );


            const x =
                clamp(
                    xPercent *
                    window.innerWidth,
                    0,
                    maxX
                );

            const y =
                clamp(
                    yPercent *
                    window.innerHeight,
                    0,
                    maxY
                );


            element.style.left =
                x + "px";

            element.style.top =
                y + "px";

        }


        /* =====================================================
           RENDER
        ===================================================== */

        function renderMessage(
            message
        ) {

            const existing =
                document
                    .getElementById(
                        message.id
                    );


            if (existing) {

                updateElementPosition(

                    message.id,

                    message.xPercent,

                    message.yPercent

                );

                return;

            }


            const element =
                document
                    .createElement(
                        "div"
                    );


            element.className =
                "popped-msg";

            element.id =
                message.id;

            element.innerText =
                message.text;


            if (message.bold) {

                element.style.fontWeight =
                    "bold";

            }


            if (message.italic) {

                element.style.fontStyle =
                    "italic";

            }


            if (message.underline) {

                element.style.textDecoration =
                    "underline";

            }


            wall.appendChild(
                element
            );


            updateElementPosition(

                message.id,

                message.xPercent,

                message.yPercent

            );


            setupElementDraggability(
                element
            );

        }


        /* =====================================================
           DRAGGING
        ===================================================== */

        function setupElementDraggability(
            element
        ) {

            let dragging =
                false;

            let offsetX =
                0;

            let offsetY =
                0;

            let lastSync =
                0;


            element.addEventListener(

                "pointerdown",

                function(event) {

                    if (
                        !draggingEnabled
                    ) {

                        return;

                    }


                    dragging =
                        true;


                    element
                        .classList
                        .add(
                            "dragging"
                        );


                    element
                        .setPointerCapture(
                            event.pointerId
                        );


                    const rect =
                        element
                            .getBoundingClientRect();


                    offsetX =
                        event.clientX -
                        rect.left;

                    offsetY =
                        event.clientY -
                        rect.top;


                    event.preventDefault();

                }

            );


            element.addEventListener(

                "pointermove",

                function(event) {

                    if (
                        !dragging ||
                        !draggingEnabled
                    ) {

                        return;

                    }


                    const x =
                        clamp(

                            event.clientX -
                            offsetX,

                            0,

                            window.innerWidth -
                            element.offsetWidth

                        );


                    const y =
                        clamp(

                            event.clientY -
                            offsetY,

                            0,

                            window.innerHeight -
                            element.offsetHeight

                        );


                    const xPercent =
                        x /
                        window.innerWidth;

                    const yPercent =
                        y /
                        window.innerHeight;


                    element.style.left =
                        x + "px";

                    element.style.top =
                        y + "px";


                    element.dataset.xPercent =
                        xPercent;

                    element.dataset.yPercent =
                        yPercent;


                    const now =
                        Date.now();


                    if (
                        now -
                        lastSync >
                        100
                    ) {

                        lastSync =
                            now;


                        syncPosition(

                            element.id,

                            xPercent,

                            yPercent

                        );

                    }

                }

            );


            element.addEventListener(

                "pointerup",

                async function() {

                    if (!dragging) {

                        return;

                    }


                    dragging =
                        false;


                    element
                        .classList
                        .remove(
                            "dragging"
                        );


                    await syncPosition(

                        element.id,

                        Number(
                            element
                                .dataset
                                .xPercent
                        ),

                        Number(
                            element
                                .dataset
                                .yPercent
                        )

                    );

                }

            );

        }


        async function syncPosition(

            id,

            xPercent,

            yPercent

        ) {

            if (!supabaseClient) {

                return;

            }


            await supabaseClient

                .from(
                    "pops"
                )

                .update({

                    x_percent:
                        xPercent,

                    y_percent:
                        yPercent

                })

                .eq(
                    "id",
                    id
                );

        }


        /* =====================================================
           SEND
        ===================================================== */

        async function sendMessage() {

            const text =
                input.value
                    .trim();


            if (!text) {

                return;

            }


            /*
                ABSOLUTE SECRET PROTECTION.

                The secret can NEVER become
                a database message.
            */

            if (
                text.toLowerCase() ===
                ADMIN_SECRET
            ) {

                input.value =
                    "";

                openAdmin();

                return;

            }


            if (
                wallLocked
            ) {

                alert(
                    "The wall is currently locked."
                );

                return;

            }


            const payload = {

                id:
                    "pop_" +
                    crypto.randomUUID(),

                text:
                    text,

                xPercent:
                    Math.random() *
                    0.65 +
                    0.05,

                yPercent:
                    Math.random() *
                    0.60 +
                    0.05,

                bold:
                    currentStyles.bold,

                italic:
                    currentStyles.italic,

                underline:
                    currentStyles.underline

            };


            input.value =
                "";


            renderMessage(
                payload
            );


            const {
                error
            } =

                await supabaseClient

                    .from(
                        "pops"
                    )

                    .insert({

                        id:
                            payload.id,

                        text:
                            payload.text,

                        x_percent:
                            payload.xPercent,

                        y_percent:
                            payload.yPercent,

                        bold:
                            payload.bold,

                        italic:
                            payload.italic,

                        underline:
                            payload.underline

                    });


            if (error) {

                console.error(
                    error
                );

            }


            await trimOldMessages();

        }


        /* =====================================================
           TRIM
        ===================================================== */

        async function trimOldMessages() {

            const {
                data,
                error
            } =

                await supabaseClient

                    .from(
                        "pops"
                    )

                    .select(
                        "id, created_at"
                    )

                    .order(
                        "created_at",
                        {
                            ascending:
                                false
                        }
                    );


            if (
                error ||
                data.length <=
                MAX_MESSAGES
            ) {

                return;

            }


            const ids =
                data
                    .slice(
                        MAX_MESSAGES
                    )
                    .map(
                        item =>
                            item.id
                    );


            await supabaseClient

                .from(
                    "pops"
                )

                .delete()

                .in(
                    "id",
                    ids
                );

        }


        /* =====================================================
           LOAD
        ===================================================== */

        async function loadExistingPops() {

            const {
                data,
                error
            } =

                await supabaseClient

                    .from(
                        "pops"
                    )

                    .select(
                        "*"
                    )

                    .order(
                        "created_at",
                        {
                            ascending:
                                true
                        }
                    )

                    .limit(
                        MAX_MESSAGES
                    );


            if (error) {

                console.error(
                    error
                );

                return;

            }


            data.forEach(

                function(pop) {

                    renderMessage({

                        id:
                            pop.id,

                        text:
                            pop.text,

                        xPercent:
                            pop.x_percent,

                        yPercent:
                            pop.y_percent,

                        bold:
                            pop.bold,

                        italic:
                            pop.italic,

                        underline:
                            pop.underline

                    });

                }

            );

        }


        /* =====================================================
           REALTIME
        ===================================================== */

        function startRealtime() {

            supabaseClient

                .channel(
                    "family-wall"
                )


                .on(

                    "postgres_changes",

                    {

                        event:
                            "INSERT",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    function(payload) {

                        const pop =
                            payload.new;


                        renderMessage({

                            id:
                                pop.id,

                            text:
                                pop.text,

                            xPercent:
                                pop.x_percent,

                            yPercent:
                                pop.y_percent,

                            bold:
                                pop.bold,

                            italic:
                                pop.italic,

                            underline:
                                pop.underline

                        });

                    }

                )


                .on(

                    "postgres_changes",

                    {

                        event:
                            "UPDATE",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    function(payload) {

                        const pop =
                            payload.new;


                        updateElementPosition(

                            pop.id,

                            pop.x_percent,

                            pop.y_percent

                        );

                    }

                )


                .on(

                    "postgres_changes",

                    {

                        event:
                            "DELETE",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    function(payload) {

                        const pop =
                            payload.old;


                        const element =
                            document
                                .getElementById(
                                    pop.id
                                );


                        if (element) {

                            element.remove();

                        }

                    }

                )


                .subscribe(

                    function(status) {

                        if (
                            status ===
                            "SUBSCRIBED"
                        ) {

                            connectionStatus
                                .innerText =
                                "● LIVE";

                        }

                    }

                );

        }


        /* =====================================================
           ADMIN COMMAND RUNNER
        ===================================================== */

        async function runAdminCommand() {

            const command =
                adminCommandInput
                    .value
                    .trim()
                    .toLowerCase();


            const value =
                adminValueInput
                    .value
                    .trim();


            switch(command) {


                case "clear-wall":

                    await adminClearWall();

                    break;


                case "lock-wall":

                    wallLocked =
                        true;

                    sendButton.disabled =
                        true;

                    sendButton.innerText =
                        "LOCKED";

                    setAdminOutput(
                        "Wall locked."
                    );

                    break;


                case "unlock-wall":

                    wallLocked =
                        false;

                    sendButton.disabled =
                        false;

                    sendButton.innerText =
                        "POP IT!";

                    setAdminOutput(
                        "Wall unlocked."
                    );

                    break;


                case "freeze-dragging":

                    draggingEnabled =
                        false;

                    setAdminOutput(
                        "Dragging frozen."
                    );

                    break;


                case "enable-dragging":

                    draggingEnabled =
                        true;

                    setAdminOutput(
                        "Dragging enabled."
                    );

                    break;


                case "dark-mode":

                    document.body
                        .classList
                        .add(
                            "dark"
                        );

                    setAdminOutput(
                        "Dark mode enabled."
                    );

                    break;


                case "light-mode":

                    document.body
                        .classList
                        .remove(
                            "dark"
                        );

                    setAdminOutput(
                        "Light mode enabled."
                    );

                    break;


                case "announce":

                    if (!value) {

                        setAdminOutput(
                            "Enter announcement in Value."
                        );

                        return;

                    }

                    await adminAnnounce(
                        value
                    );

                    break;


                case "shake-wall":

                    adminShakeWall();

                    setAdminOutput(
                        "Wall shaken."
                    );

                    break;


                case "randomize":

                    await adminRandomize();

                    break;


                default:

                    setAdminOutput(
                        "Unknown command."
                    );

                    return;

            }


            adminCommandInput.value =
                "";

            adminValueInput.value =
                "";

        }


        /* =====================================================
           CLEAR WALL
        ===================================================== */

        async function adminClearWall() {

            const confirmed =
                confirm(
                    "Delete every message?"
                );


            if (!confirmed) {

                setAdminOutput(
                    "Cancelled."
                );

                return;

            }


            const {
                error
            } =

                await supabaseClient

                    .from(
                        "pops"
                    )

                    .delete()

                    .neq(
                        "id",
                        ""
                    );


            if (error) {

                console.error(
                    error
                );

                setAdminOutput(
                    "Clear failed."
                );

                return;

            }


            setAdminOutput(
                "Wall cleared."
            );

        }


        /* =====================================================
           ANNOUNCEMENT
        ===================================================== */

        async function adminAnnounce(
            text
        ) {

            const payload = {

                id:
                    "pop_" +
                    crypto.randomUUID(),

                text:
                    "📢 " +
                    text,

                xPercent:
                    0.3,

                yPercent:
                    0.1,

                bold:
                    true,

                italic:
                    false,

                underline:
                    false

            };


            const {
                error
            } =

                await supabaseClient

                    .from(
                        "pops"
                    )

                    .insert({

                        id:
                            payload.id,

                        text:
                            payload.text,

                        x_percent:
                            payload.xPercent,

                        y_percent:
                            payload.yPercent,

                        bold:
                            true,

                        italic:
                            false,

                        underline:
                            false

                    });


            if (error) {

                setAdminOutput(
                    "Announcement failed."
                );

                console.error(
                    error
                );

                return;

            }


            await trimOldMessages();


            setAdminOutput(
                "Announcement sent."
            );

        }


        /* =====================================================
           SHAKE
        ===================================================== */

        function adminShakeWall() {

            const messages =
                document
                    .querySelectorAll(
                        ".popped-msg"
                    );


            messages.forEach(

                function(element) {

                    element
                        .classList
                        .remove(
                            "shake"
                        );


                    void element.offsetWidth;


                    element
                        .classList
                        .add(
                            "shake"
                        );

                }

            );

        }


        /* =====================================================
           RANDOMIZE
        ===================================================== */

        async function adminRandomize() {

            const messages =
                document
                    .querySelectorAll(
                        ".popped-msg"
                    );


            setAdminOutput(
                "Randomizing..."
            );


            for (
                const element
                of messages
            ) {

                const xPercent =
                    Math.random() *
                    0.70 +
                    0.05;


                const yPercent =
                    Math.random() *
                    0.65 +
                    0.05;


                updateElementPosition(

                    element.id,

                    xPercent,

                    yPercent

                );


                await supabaseClient

                    .from(
                        "pops"
                    )

                    .update({

                        x_percent:
                            xPercent,

                        y_percent:
                            yPercent

                    })

                    .eq(
                        "id",
                        element.id
                    );

            }


            setAdminOutput(
                "Messages randomized."
            );

        }


        /* =====================================================
           ADMIN ENTER KEY
        ===================================================== */

        adminCommandInput.addEventListener(

            "keydown",

            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    runAdminCommand();

                }

            }

        );


        adminValueInput.addEventListener(

            "keydown",

            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    runAdminCommand();

                }

            }

        );


        /* =====================================================
           START
        ===================================================== */

        async function startApp() {

            if (
                !initializeSupabase()
            ) {

                sendButton.disabled =
                    true;

                return;

            }


            connectionStatus.innerText =
                "Loading wall...";


            await trimOldMessages();

            await loadExistingPops();

            startRealtime();

        }


        startApp();

    </script>

</body>

</html>
