<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Family Pop Wall
    </title>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="config.js"
    ></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                #eef2f3;

            overflow:
                hidden;

            transition:
                background
                0.3s ease;

        }


        body.dark {

            background:
                #111827;

        }


        /* ============================================
           WALL
        ============================================ */

        #canvas-wall {

            position:
                fixed;

            inset:
                0;

            overflow:
                hidden;

        }


        /* ============================================
           LIVE STATUS
        ============================================ */

        #connection-status {

            position:
                fixed;

            top:
                15px;

            left:
                50%;

            transform:
                translateX(-50%);

            background:
                white;

            padding:
                7px 13px;

            border-radius:
                20px;

            box-shadow:
                0 3px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

            font-size:
                12px;

            font-weight:
                600;

            z-index:
                5000;

        }


        /* ============================================
           MESSAGES
        ============================================ */

        .popped-msg {

            position:
                absolute;

            min-width:
                50px;

            max-width:
                350px;

            padding:
                10px 14px;

            background:
                white;

            border-radius:
                10px;

            box-shadow:
                0 5px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.14
                );

            font-size:
                17px;

            word-break:
                break-word;

            cursor:
                grab;

            user-select:
                none;

            touch-action:
                none;

            z-index:
                10;

            transform:
                scale(0);

            animation:
                popIn
                0.28s
                cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                )
                forwards;

        }


        @keyframes popIn {

            to {

                transform:
                    scale(1);

            }

        }


        /* ============================================
           NORMAL CONTROL PANEL
        ============================================ */

        #control-panel {

            position:
                fixed;

            left:
                50%;

            bottom:
                20px;

            transform:
                translateX(-50%);

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                12px 16px;

            background:
                white;

            border-radius:
                30px;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.18
                );

            z-index:
                5000;

        }


        #msg-input {

            width:
                270px;

            border:
                1px solid
                #d5d5d5;

            border-radius:
                20px;

            outline:
                none;

            padding:
                10px 14px;

            font-size:
                15px;

        }


        .format-btn {

            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            border:
                1px solid
                #ddd;

            background:
                #f6f6f6;

            cursor:
                pointer;

            font-size:
                16px;

        }


        .format-btn.active {

            background:
                #222;

            color:
                white;

        }


        #send-btn {

            height:
                40px;

            padding:
                0 18px;

            border:
                none;

            border-radius:
                20px;

            background:
                #ff4757;

            color:
                white;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        /* ============================================
           ADMIN CONSOLE
        ============================================ */

        #admin-panel {

            position:
                fixed;

            top:
                70px;

            right:
                20px;

            width:
                360px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.98
                );

            color:
                white;

            padding:
                20px;

            border-radius:
                18px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            display:
                none;

            z-index:
                10000;

        }


        #admin-panel.open {

            display:
                block;

        }


        #admin-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                15px;

        }


        #admin-close {

            background:
                transparent;

            border:
                none;

            color:
                white;

            font-size:
                20px;

            cursor:
                pointer;

        }


        .admin-label {

            display:
                block;

            margin-top:
                12px;

            margin-bottom:
                6px;

            color:
                #94a3b8;

            font-size:
                12px;

            font-weight:
                bold;

        }


        .admin-input {

            width:
                100%;

            padding:
                11px;

            background:
                #0f172a;

            color:
                white;

            border:
                1px solid
                #334155;

            border-radius:
                10px;

            outline:
                none;

        }


        #admin-run {

            width:
                100%;

            margin-top:
                15px;

            padding:
                12px;

            border:
                none;

            border-radius:
                10px;

            background:
                #38bdf8;

            color:
                #082f49;

            font-weight:
                900;

            cursor:
                pointer;

        }


        #admin-output {

            margin-top:
                14px;

            padding:
                10px;

            border-radius:
                10px;

            background:
                #020617;

            color:
                #86efac;

            font-family:
                monospace;

            font-size:
                12px;

        }


        @media (
            max-width: 700px
        ) {

            #control-panel {

                width:
                    calc(
                        100% - 20px
                    );

                flex-wrap:
                    wrap;

            }


            #msg-input {

                width:
                    100%;

            }


            #admin-panel {

                width:
                    calc(
                        100% - 20px
                    );

                right:
                    10px;

            }

        }

    </style>

</head>


<body>


    <div
        id="canvas-wall"
    ></div>


    <div
        id="connection-status"
    >
        Connecting...
    </div>


    <div
        id="control-panel"
    >

        <input
            id="msg-input"
            type="text"
            maxlength="500"
            placeholder="Type something..."
            autocomplete="off"
        >


        <button
            class="format-btn"
            id="bold-btn"
            onclick="toggleStyle('bold')"
        >
            <b>B</b>
        </button>


        <button
            class="format-btn"
            id="italic-btn"
            onclick="toggleStyle('italic')"
        >
            <i>I</i>
        </button>


        <button
            class="format-btn"
            id="underline-btn"
            onclick="toggleStyle('underline')"
        >
            <u>U</u>
        </button>


        <button
            id="send-btn"
            onclick="sendMessage()"
        >
            POP IT!
        </button>

    </div>


    <!-- ============================================
         ADMIN PANEL
    ============================================= -->

    <div
        id="admin-panel"
    >

        <div
            id="admin-header"
        >

            <strong>
                ⚡ ADMIN CONSOLE
            </strong>


            <button
                id="admin-close"
                onclick="closeAdmin()"
            >
                ✕
            </button>

        </div>


        <label
            class="admin-label"
        >
            Command
        </label>


        <input
            id="admin-command-input"
            class="admin-input"
            list="admin-command-list"
            placeholder="Select command..."
            autocomplete="off"
        >


        <datalist
            id="admin-command-list"
        ></datalist>


        <label
            class="admin-label"
        >
            Value
        </label>


        <input
            id="admin-value-input"
            class="admin-input"
            placeholder="Optional value..."
            autocomplete="off"
        >


        <button
            id="admin-run"
            onclick="runAdminCommand()"
        >
            RUN COMMAND
        </button>


        <div
            id="admin-output"
        >
            Loading commands...
        </div>

    </div>


    <script type="module">


        /* ============================================
           GLOBAL REFERENCES
        ============================================ */

        const wall =
            document.getElementById(
                "canvas-wall"
            );


        const input =
            document.getElementById(
                "msg-input"
            );


        const connectionStatus =
            document.getElementById(
                "connection-status"
            );


        const adminPanel =
            document.getElementById(
                "admin-panel"
            );


        const adminCommandInput =
            document.getElementById(
                "admin-command-input"
            );


        const adminValueInput =
            document.getElementById(
                "admin-value-input"
            );


        const adminOutput =
            document.getElementById(
                "admin-output"
            );


        const adminCommandList =
            document.getElementById(
                "admin-command-list"
            );


        /* ============================================
           ADMIN PASSWORD
        ============================================ */

        const ADMIN_SECRET =
            "peregrinefalcsonissohandsome";


        /* ============================================
           APP STATE
        ============================================ */

        let supabaseClient =
            null;


        let realtimeChannel =
            null;


        let currentStyles = {

            bold: false,

            italic: false,

            underline: false

        };


        /*
            This Map contains ALL dynamically
            discovered admin commands.

            Example:

            adminCommands.get("shake-wall")
        */

        const adminCommands =
            new Map();


        /* ============================================
           SUPABASE INITIALIZATION
        ============================================ */

        function initializeSupabase() {


            supabaseClient =
                window.supabase
                    .createClient(

                        window
                            .SUPABASE_CONFIG
                            .URL,

                        window
                            .SUPABASE_CONFIG
                            .ANON_KEY

                    );


        }


        /* ============================================
           ADMIN FUNCTION LOADER
        ============================================ */
async function loadAdminFunctions() {

    adminOutput.innerText =
        "Scanning ADMIN-FUNCTION...";


    try {

        const response =
            await fetch(
                "/api/admin-functions",
                {
                    cache:
                        "no-store"
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.error
            );

        }


        adminCommands.clear();

        adminCommandList.innerHTML =
            "";


        for (
            const file
            of result.files
        ) {

            try {

                const module =
                    await import(
                        `/ADMIN-FUNCTION/${file}?v=${Date.now()}`
                    );


                if (
                    !Array.isArray(
                        module.commands
                    )
                ) {

                    console.warn(
                        file,
                        "does not export a commands array."
                    );

                    continue;

                }


                for (
                    const command
                    of module.commands
                ) {

                    if (
                        !command ||
                        !command.name ||
                        typeof command.run !==
                        "function"
                    ) {

                        console.warn(
                            file,
                            "contains an invalid command."
                        );

                        continue;

                    }


                    if (
                        adminCommands.has(
                            command.name
                        )
                    ) {

                        console.warn(
                            "Duplicate command:",
                            command.name
                        );

                        continue;

                    }


                    adminCommands.set(
                        command.name,
                        command
                    );


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        command.name;


                    adminCommandList
                        .appendChild(
                            option
                        );

                }

            }

            catch (error) {

                console.error(
                    "Could not load:",
                    file,
                    error
                );

            }

        }


        adminOutput.innerText =
            `${adminCommands.size} commands loaded.`;

    }

    catch (error) {

        console.error(
            error
        );


        adminOutput.innerText =
            "Could not load admin commands.";

    }

}


        /* ============================================
           SECRET ADMIN DETECTION
        ============================================ */

        input.addEventListener(

            "input",

            function() {


                if (

                    input.value
                        .trim()
                        .toLowerCase() ===
                    ADMIN_SECRET

                ) {


                    input.value =
                        "";


                    openAdmin();


                }


            }

        );


        function openAdmin() {


            adminPanel
                .classList
                .add(
                    "open"
                );


            adminCommandInput
                .focus();


        }


        function closeAdmin() {


            adminPanel
                .classList
                .remove(
                    "open"
                );


        }


        /* ============================================
           RUN ADMIN COMMAND
        ============================================ */

        async function runAdminCommand() {


            const name =
                adminCommandInput
                    .value
                    .trim();


            const value =
                adminValueInput
                    .value
                    .trim();


            const command =
                adminCommands.get(
                    name
                );


            if (!command) {


                adminOutput.innerText =
                    "Unknown command.";


                return;


            }


            adminOutput.innerText =
                `Running ${name}...`;


            try {


                /*
                    Every command receives this
                    shared context object.
                */

                const context = {

                    value:
                        value,


                    wall:
                        wall,


                    supabase:
                        supabaseClient,


                    channel:
                        realtimeChannel,


                    broadcast:
                        broadcastAdminCommand,


                    output:
                        function(message) {

                            adminOutput.innerText =
                                message;

                        },


                    getMessages:
                        function() {

                            return document
                                .querySelectorAll(
                                    ".popped-msg"
                                );

                        }

                };


                await command.run(
                    context
                );


                if (
                    adminOutput.innerText ===
                    `Running ${name}...`
                ) {


                    adminOutput.innerText =
                        `${name} completed.`;


                }


            }

            catch (error) {


                console.error(
                    error
                );


                adminOutput.innerText =
                    `ERROR: ${error.message}`;


            }


            adminCommandInput.value =
                "";


            adminValueInput.value =
                "";


        }


        /* ============================================
           UNIVERSAL COMMAND BROADCAST
        ============================================ */

        async function broadcastAdminCommand(

            command,

            payload = {}

        ) {


            await realtimeChannel
                .send({

                    type:
                        "broadcast",

                    event:
                        "admin-plugin-command",

                    payload: {

                        command:
                            command,

                        data:
                            payload

                    }

                });


        }


        /* ============================================
           RECEIVE UNIVERSAL COMMAND
        ============================================ */

        async function receiveAdminCommand(
            response
        ) {


            const name =
                response
                    .payload
                    ?.command;


            const data =
                response
                    .payload
                    ?.data;


            const command =
                adminCommands.get(
                    name
                );


            if (
                !command ||
                typeof command.receive !==
                "function"
            ) {

                return;

            }


            try {


                await command.receive({

                    data:
                        data,


                    wall:
                        wall,


                    supabase:
                        supabaseClient,


                    getMessages:
                        function() {

                            return document
                                .querySelectorAll(
                                    ".popped-msg"
                                );

                        }

                });


            }

            catch (error) {


                console.error(

                    `Remote command ${name} failed:`,

                    error

                );


            }


        }


        /* ============================================
           STYLE BUTTONS
        ============================================ */

        function toggleStyle(
            style
        ) {


            currentStyles[style] =
                !currentStyles[style];


            document
                .getElementById(

                    style +
                    "-btn"

                )
                .classList
                .toggle(

                    "active",

                    currentStyles[
                        style
                    ]

                );


        }


        /* ============================================
           RENDER MESSAGE
        ============================================ */

        function renderMessage(
            message
        ) {


            if (
                document.getElementById(
                    message.id
                )
            ) {

                return;

            }


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "popped-msg";


            element.id =
                message.id;


            element.innerText =
                message.text;


            element.style.left =
                (
                    message.xPercent *
                    window.innerWidth
                ) +
                "px";


            element.style.top =
                (
                    message.yPercent *
                    window.innerHeight
                ) +
                "px";


            if (
                message.bold
            ) {

                element.style.fontWeight =
                    "bold";

            }


            if (
                message.italic
            ) {

                element.style.fontStyle =
                    "italic";

            }


            if (
                message.underline
            ) {

                element.style.textDecoration =
                    "underline";

            }


            wall.appendChild(
                element
            );


            makeDraggable(
                element
            );


        }


        /* ============================================
           DRAGGING
        ============================================ */

        function makeDraggable(
            element
        ) {


            let dragging =
                false;


            let offsetX =
                0;


            let offsetY =
                0;


            element.addEventListener(

                "pointerdown",

                function(event) {


                    dragging =
                        true;


                    const rect =
                        element
                            .getBoundingClientRect();


                    offsetX =
                        event.clientX -
                        rect.left;


                    offsetY =
                        event.clientY -
                        rect.top;


                    element
                        .setPointerCapture(
                            event.pointerId
                        );


                }

            );


            element.addEventListener(

                "pointermove",

                function(event) {


                    if (!dragging) {

                        return;

                    }


                    const x =
                        event.clientX -
                        offsetX;


                    const y =
                        event.clientY -
                        offsetY;


                    element.style.left =
                        x +
                        "px";


                    element.style.top =
                        y +
                        "px";


                }

            );


            element.addEventListener(

                "pointerup",

                async function() {


                    dragging =
                        false;


                    const rect =
                        element
                            .getBoundingClientRect();


                    await supabaseClient

                        .from(
                            "pops"
                        )

                        .update({

                            x_percent:

                                rect.left /
                                window.innerWidth,


                            y_percent:

                                rect.top /
                                window.innerHeight

                        })

                        .eq(
                            "id",
                            element.id
                        );


                }

            );


        }


        /* ============================================
           SEND MESSAGE
        ============================================ */

        async function sendMessage() {


            const text =
                input
                    .value
                    .trim();


            if (!text) {

                return;

            }


            /*
                NEVER send admin password.
            */

            if (
                text.toLowerCase() ===
                ADMIN_SECRET
            ) {


                input.value =
                    "";


                openAdmin();


                return;


            }


            const message = {

                id:

                    "pop_" +
                    crypto.randomUUID(),


                text:
                    text,


                xPercent:

                    Math.random() *
                    0.65 +
                    0.05,


                yPercent:

                    Math.random() *
                    0.60 +
                    0.05,


                bold:
                    currentStyles.bold,


                italic:
                    currentStyles.italic,


                underline:
                    currentStyles.underline

            };


            input.value =
                "";


            renderMessage(
                message
            );


            await supabaseClient

                .from(
                    "pops"
                )

                .insert({

                    id:
                        message.id,


                    text:
                        message.text,


                    x_percent:
                        message.xPercent,


                    y_percent:
                        message.yPercent,


                    bold:
                        message.bold,


                    italic:
                        message.italic,


                    underline:
                        message.underline

                });


        }


        /* ============================================
           LOAD MESSAGES
        ============================================ */

        async function loadMessages() {


            const {
                data
            } =

                await supabaseClient

                    .from(
                        "pops"
                    )

                    .select(
                        "*"
                    )

                    .order(

                        "created_at",

                        {
                            ascending:
                                true
                        }

                    );


            if (!data) {

                return;

            }


            data.forEach(

                pop => {

                    renderMessage({

                        id:
                            pop.id,


                        text:
                            pop.text,


                        xPercent:
                            pop.x_percent,


                        yPercent:
                            pop.y_percent,


                        bold:
                            pop.bold,


                        italic:
                            pop.italic,


                        underline:
                            pop.underline

                    });

                }

            );


        }


        /* ============================================
           REALTIME
        ============================================ */

        function startRealtime() {


            realtimeChannel =
                supabaseClient
                    .channel(

                        "family-wall",

                        {

                            config: {

                                broadcast: {

                                    self:
                                        true

                                }

                            }

                        }

                    );


            realtimeChannel

                .on(

                    "postgres_changes",

                    {

                        event:
                            "INSERT",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    payload => {


                        const pop =
                            payload.new;


                        renderMessage({

                            id:
                                pop.id,

                            text:
                                pop.text,

                            xPercent:
                                pop.x_percent,

                            yPercent:
                                pop.y_percent,

                            bold:
                                pop.bold,

                            italic:
                                pop.italic,

                            underline:
                                pop.underline

                        });


                    }

                )


                .on(

                    "postgres_changes",

                    {

                        event:
                            "DELETE",

                        schema:
                            "public",

                        table:
                            "pops"

                    },

                    payload => {


                        document
                            .getElementById(
                                payload.old.id
                            )
                            ?.remove();


                    }

                )


                .on(

                    "broadcast",

                    {

                        event:
                            "admin-plugin-command"

                    },

                    receiveAdminCommand

                )


                .subscribe(

                    status => {


                        if (
                            status ===
                            "SUBSCRIBED"
                        ) {


                            connectionStatus.innerText =
                                "● LIVE";


                        }


                    }

                );


        }


        /* ============================================
           ENTER KEYS
        ============================================ */

        input.addEventListener(

            "keydown",

            function(event) {


                if (
                    event.key ===
                    "Enter"
                ) {


                    event.preventDefault();


                    sendMessage();


                }


            }

        );


        adminCommandInput
            .addEventListener(

                "keydown",

                function(event) {


                    if (
                        event.key ===
                        "Enter"
                    ) {


                        runAdminCommand();


                    }


                }

            );


        adminValueInput
            .addEventListener(

                "keydown",

                function(event) {


                    if (
                        event.key ===
                        "Enter"
                    ) {


                        runAdminCommand();


                    }


                }

            );


        /* ============================================
           EXPOSE FUNCTIONS USED BY HTML BUTTONS
        ============================================ */

        window.toggleStyle =
            toggleStyle;


        window.sendMessage =
            sendMessage;


        window.runAdminCommand =
            runAdminCommand;


        window.closeAdmin =
            closeAdmin;


        /* ============================================
           START
        ============================================ */

        async function startApp() {


            initializeSupabase();


            await loadAdminFunctions();


            await loadMessages();


            startRealtime();


        }


        startApp();


    </script>

</body>

</html>
