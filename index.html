<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Connected Pop Wall</title>
    
    <!-- 1. Load separate credentials configuration layout file -->
    <script src="config.js"></script>
    
    <!-- 2. Load Supabase real-time engine tracking client -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; background: #eef2f3; 
            overflow: hidden; height: 100vh; width: 100vw; 
        }
        #canvas-wall { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; 
        }
        #control-panel { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: white; padding: 15px 25px; border-radius: 50px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; gap: 10px; align-items: center; z-index: 100; 
        }
        input[type="text"] { 
            border: 1px solid #ccc; padding: 10px 15px; border-radius: 20px; outline: none; width: 250px; font-size: 14px; 
        }
        .btn { 
            border: 1px solid #ddd; background: #f9f9f9; padding: 10px; border-radius: 50%; 
            width: 40px; height: 40px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none;
        }
        .btn.active { 
            background: #0070f3; color: white; border-color: #0070f3; 
        }
        #send-btn { 
            background: #ff4757; color: white; border: none; border-radius: 20px; 
            padding: 10px 20px; cursor: pointer; font-weight: bold; 
        }
        #send-btn:hover { background: #ff6b81; }
        
        .popped-msg { 
            position: absolute; background: white; padding: 10px 15px; border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: move; user-select: none; z-index: 10; font-size: 16px; 
            transform: scale(0); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            transition: box-shadow 0.2s ease;
        }
        .popped-msg:active { box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 1000; }
        @keyframes popIn { to { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="canvas-wall"></div>

    <div id="control-panel">
        <input type="text" id="msg-input" placeholder="Type a message here...">
        <button class="btn" id="bold-btn" onclick="toggleStyle('bold')">B</button>
        <button class="btn" id="italic-btn" onclick="toggleStyle('italic')">I</button>
        <button class="btn" id="underline-btn" onclick="toggleStyle('underline')">U</button>
        <button id="send-btn" onclick="sendMessage()">POP IT!</button>
    </div>

    <script>
        const wall = document.getElementById('canvas-wall');
        let currentStyles = { bold: false, italic: false, underline: false };
        let supabaseClient = null;

        try {
            if (typeof supabase !== 'undefined' && window.SUPABASE_CONFIG) {
                supabaseClient = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);
                
                // Fetch older data elements straight out of the database list on initialization
                loadExistingPops();

                // Open subscription listening for live updates across table fields
                supabaseClient
                    .channel('table-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pops' }, (payload) => {
                        console.log("Inbound database synchronizer streaming event:", payload);
                        
                        if (payload.eventType === 'INSERT') {
                            // Map database structural parameters back to rendering names
                            const normalized = {
                                id: payload.new.id,
                                text: payload.new.text,
                                xPercent: payload.new.x_percent,
                                yPercent: payload.new.y_percent,
                                bold: payload.new.bold,
                                italic: payload.new.italic,
                                underline: payload.new.underline
                            };
                            renderMessage(normalized);
                        } else if (payload.eventType === 'UPDATE') {
                            updateElementPosition(payload.new.id, payload.new.x_percent, payload.new.y_percent);
                        }
                    })
                    .subscribe();
            }
        } catch(err) {
            console.error("Initialization failure checks:", err);
        }

        async function loadExistingPops() {
            if(!supabaseClient) return;
            const { data, error } = await supabaseClient.from('pops').select('*');
            if (data && !error) {
                data.forEach(pop => {
                    const normalized = {
                        id: pop.id, text: pop.text,
                        xPercent: pop.x_percent, yPercent: pop.y_percent,
                        bold: pop.bold, italic: pop.italic, underline: pop.underline
                    };
                    renderMessage(normalized, true); // Silent setup for histories
                });
            }
        }

        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) { }
        }

        function toggleStyle(style) {
            currentStyles[style] = !currentStyles[style];
            const targetButton = document.getElementById(`${style}-btn`);
            if (targetButton) {
                targetButton.classList.toggle('active', currentStyles[style]);
            }
        }

        function renderMessage(msg, silent = false) {
            // Guard loop tracking duplication checks
            const existing = document.getElementById(msg.id);
            if (existing) {
                updateElementPosition(msg.id, msg.xPercent, msg.yPercent);
                return;
            }

            const div = document.createElement('div');
            div.className = 'popped-msg';
            div.id = msg.id;
            div.innerText = msg.text;
            
            div.style.left = (msg.xPercent * window.innerWidth) + 'px';
            div.style.top = (msg.yPercent * window.innerHeight) + 'px';
            
            if (msg.bold) div.style.fontWeight = 'bold';
            if (msg.italic) div.style.fontStyle = 'italic';
            if (msg.underline) div.style.textDecoration = 'underline';
            
            // Link interactive moving listener logic loops
            setupElementDraggability(div);
            
            wall.appendChild(div);
            if (!silent) playPopSound();
        }

        function updateElementPosition(id, xPercent, yPercent) {
            const target = document.getElementById(id);
            if (target) {
                target.style.left = (xPercent * window.innerWidth) + 'px';
                target.style.top = (yPercent * window.innerHeight) + 'px';
            }
        }

        function setupElementDraggability(element) {
            let activeDrag = false, startX, startY;

            element.addEventListener('mousedown', (e) => {
                activeDrag = true;
                startX = e.clientX - element.offsetLeft;
                startY = e.clientY - element.offsetTop;
            });

            document.addEventListener('mousemove', async (e) => {
                if (!activeDrag) return;
                
                const newX = e.clientX - startX;
                const newY = e.clientY - startY;
                
                const x_percent = newX / window.innerWidth;
                const y_percent = newY / window.innerHeight;

                element.style.left = newX + 'px';
                element.style.top = newY + 'px';

                if (supabaseClient) {
                    await supabaseClient
                        .from('pops')
                        .update({ x_percent, y_percent })
                        .eq('id', element.id);
                }
            });

            document.addEventListener('mouseup', () => { activeDrag = false; });
            
            // Mobile display touch drag configuration controls
            element.addEventListener('touchstart', (e) => {
                activeDrag = true;
                const touch = e.touches[0];
                startX = touch.clientX - element.offsetLeft;
                startY = touch.clientY - element.offsetTop;
            });

            document.addEventListener('touchmove', async (e) => {
                if (!activeDrag) return;
                const touch = e.touches[0];
                const newX = touch.clientX - startX;
                const newY = touch.clientY - startY;
                
                const x_percent = newX / window.innerWidth;
                const y_percent = newY / window.innerHeight;

Use code with caution.
element.style.left = newX + 'px';
element.style.top = newY + 'px';
if (supabaseClient) {
await supabaseClient
.from('pops')
.update({ x_percent, y_percent })
.eq('id', element.id);
}
});
document.addEventListener('touchend', () => { activeDrag = false; });
}
async function sendMessage() {
const inputField = document.getElementById('msg-input');
const text = inputField.value.trim();
if (!text) return;
const payload = {
id: "pop_" + Math.random().toString(36).substr(2, 9),
text: text,
xPercent: Math.random() * 0.7 + 0.05,
yPercent: Math.random() * 0.7 + 0.05,
bold: currentStyles.bold,
italic: currentStyles.italic,
underline: currentStyles.underline
};
// 1. Force display to load immediately on your device layout instantly
renderMessage(payload);
inputField.value = '';
// 2. Safely sync data to database background table structure
if (supabaseClient) {
await supabaseClient.from('pops').insert([{
id: payload.id,
text: payload.text,
x_percent: payload.xPercent,
y_percent: payload.yPercent,
bold: payload.bold,
italic: payload.italic,
underline: payload.underline
}]);
}
}
